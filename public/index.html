<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Base - 対戦ゲームの土台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body class="bb-theme">
  <main>
    <div class="topbar">
      <div class="topbar-brand">
        <span class="topbar-badge">11V11 HISTORICAL DRAFT</span>
        <h1 id="app-heading">Battle Base</h1>
      </div>
      <div class="topbar-controls">
        <button id="help-toggle-btn" class="help-toggle-btn secondary small" type="button" aria-expanded="false">遊び方を表示</button>
        <div class="lang-switch">
          <label for="lang-select" id="lang-label">言語</label>
          <select id="lang-select" aria-label="Language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </div>
      </div>
    </div>

    <!-- この土台が何なのかの説明 -->
    <section class="about bb-hud-panel" id="about" hidden>
      <h2 id="about-title">これは「通信対戦ゲームの土台」です</h2>
      <p id="about-intro">スマホやパソコンで部屋に集まって、みんなで遊ぶ対戦ゲームを作るための、ひな形です。
        いま入っているサンプルは、<strong>ミニ人生ゲーム</strong>（ターン制・2〜6人）です。</p>
      <ul>
        <li><strong id="about-builtin-label">できあがっている部分:</strong> <span id="about-builtin-text">部屋を作る・入る、招待リンク、参加者の一覧、みんなの画面にデータを届ける通信</span></li>
        <li><strong id="about-custom-label">自分たちで作る部分:</strong> <span id="about-custom-text">ゲームのルールと画面（<code>public/game.js</code>）</span></li>
      </ul>
      <p id="about-footer">まず、サンプルをそのまま遊んでから、<code>game.js</code> のマスやイベントを増やして改造します。</p>
    </section>

    <!-- ロビー: 部屋を作る／部屋に入る -->
    <section id="lobby" class="bb-lobby-shell bb-hud-panel">
      <div class="bb-lobby-field">
        <label for="name"><span id="name-label">名前（12文字まで）</span>
          <input id="name" maxlength="12" placeholder="なまえ" autocomplete="off">
        </label>
      </div>
      <div class="bb-lobby-modes">
        <div class="row bb-lobby-mode bb-lobby-mode--create">
          <button id="create-btn" class="bb-btn-primary">部屋を作る</button>
        </div>
        <div class="row bb-lobby-mode bb-lobby-mode--join">
          <input id="room-code" maxlength="4" placeholder="部屋コード（4文字）" autocomplete="off">
          <button id="join-btn" class="bb-btn-accent">部屋に入る</button>
        </div>
      </div>
    </section>

    <!-- 部屋の中: 参加者の一覧とゲーム開始 -->
    <section id="room" class="bb-room-shell bb-hud-panel" hidden>
      <div class="room-header-bar">
        <div class="room-code-wrap">
          <span id="room-code-label">部屋コード: </span><strong id="room-id"></strong>
          <button id="copy-btn" class="small">招待リンクをコピー</button>
        </div>
        <div class="room-actions">
          <button id="start-btn" class="room-btn bb-btn-primary" hidden>ゲームを始める</button>
          <button id="back-btn" class="secondary room-btn" hidden>ロビーに戻る</button>
          <button id="leave-btn" class="secondary room-btn">部屋を出る</button>
        </div>
      </div>
      <ul id="players" class="bb-room-players"></ul>
      <p id="wait-note" class="note bb-room-wait-note" hidden></p>
    </section>

    <!-- ゲームの画面（game.js がここに描く） -->
    <section id="game-area" hidden></section>

    <p id="toast" role="status"></p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
